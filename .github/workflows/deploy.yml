name: Build and deploy Jekyll site

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Debug: GH_PAGES_PAT presence"
        run: |
          if [ -z "${{ secrets.GH_PAGES_PAT }}" ]; then
            echo "GH_PAGES_PAT is NOT set"
            exit 1
          else
            echo "GH_PAGES_PAT is present"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install dependencies
        run: |
          gem install bundler jekyll
          if [ -f Gemfile ]; then bundle install --jobs 4 --retry 3; fi

      - name: Build site with Jekyll (via Bundler)
        run: |
          if [ -f Gemfile ]; then
            bundle exec jekyll build --destination _site
          else
            jekyll build --destination _site
          fi

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Use the explicit PAT stored in GH_PAGES_PAT for pushing
          github_token: ${{ secrets.GH_PAGES_PAT }}
          publish_dir: ./_site
          publish_branch: gh-pages
